<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skier VTuber Avatar</title>
<style>
  :root {
    --panel: rgba(12, 22, 38, 0.82);
    --panel-text: #eef6ff;
    --accent: #ff7a2f;
    --accent-2: #1aa6a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: linear-gradient(#6fb7ff 0%, #bfe3ff 60%, #eaf6ff 100%); }
  body.bg-green { background: #00ff00; }
  body.bg-transparent { background: transparent; }
  body.bg-green #scene, body.bg-transparent #scene, body.bg-green #snow, body.bg-transparent #snow { display: none; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; }
  #avatar { height: 96vh; max-width: 100vw; display: block; }

  #ui { position: fixed; left: 16px; bottom: 16px; width: min(340px, calc(100vw - 32px)); background: var(--panel); color: var(--panel-text);
        border-radius: 14px; padding: 14px; font-size: 13px; backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  body.ui-hidden #ui { display: none; }
  #ui h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .3px; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  #ui button { background: #23344f; color: var(--panel-text); border: 1px solid #3a5070; border-radius: 8px; padding: 6px 9px; font-size: 12px; cursor: pointer; }
  #ui button.on { background: var(--accent); border-color: var(--accent); color: #1b1006; font-weight: 600; }
  #ui button.primary { background: var(--accent-2); border-color: var(--accent-2); color: #04201f; font-weight: 600; }
  #ui label { display: flex; align-items: center; gap: 8px; width: 100%; }
  #ui label span { width: 86px; flex: none; }
  #ui input[type=range] { flex: 1; }
  #meter { height: 8px; background: #23344f; border-radius: 4px; overflow: hidden; width: 100%; }
  #meter div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  #ui .keys { opacity: .75; font-size: 11px; line-height: 1.5; margin-top: 6px; }
  #ui .status { font-size: 11px; opacity: .8; }
</style>
</head>
<body>

<!-- Mountain backdrop (scene mode only) -->
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <circle cx="1280" cy="170" r="70" fill="#fff6c9"/>
  <polygon points="0,620 220,330 380,520 560,260 760,560 900,400 1080,600 1250,300 1420,520 1600,380 1600,900 0,900" fill="#9fb8d6"/>
  <polygon points="560,260 610,330 585,325 560,360 530,320 505,330" fill="#ffffff"/>
  <polygon points="1250,300 1300,370 1270,362 1245,395 1220,360 1195,372" fill="#ffffff"/>
  <polygon points="0,720 300,470 520,660 760,430 1000,690 1240,480 1600,700 1600,900 0,900" fill="#e9f3ff"/>
  <polygon points="0,820 400,700 800,800 1200,690 1600,800 1600,900 0,900" fill="#ffffff"/>
  <g fill="#2f5d4a">
    <polygon points="120,830 150,740 180,830"/><polygon points="170,840 205,730 240,840"/>
    <polygon points="1360,820 1390,730 1420,820"/><polygon points="1410,835 1450,715 1490,835"/>
  </g>
</svg>
<canvas id="snow"></canvas>

<div id="stage">
<svg id="avatar" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg" aria-label="Skier VTuber avatar">
  <defs>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b2bd6"/>
      <stop offset="0.45" stop-color="#e0408f"/>
      <stop offset="0.8" stop-color="#ff9a2f"/>
      <stop offset="1" stop-color="#ffd84a"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb8b8"/>
      <stop offset="1" stop-color="#11807f"/>
    </linearGradient>
    <clipPath id="domeClip"><path d="M178,262 C175,170 240,138 300,138 C360,138 425,170 422,262 Z"/></clipPath>
    <clipPath id="eyeClipL"><ellipse cx="255" cy="318" rx="23" ry="18"/></clipPath>
    <clipPath id="eyeClipR"><ellipse cx="345" cy="318" rx="23" ry="18"/></clipPath>
    <clipPath id="mouthClip"><path id="mouthClipPath" d=""/></clipPath>
    <pattern id="ribs" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1f3b5c"/><rect width="4" height="10" fill="#18304c"/>
    </pattern>
    <path id="hairLock" d="M186,240 C158,282 146,338 154,398 L170,374 L168,418 L188,384 L198,410 L204,350 L212,300 Z"/>
  </defs>

  <g id="rig">
    <!-- Body -->
    <g id="body">
      <rect x="262" y="420" width="76" height="100" fill="#c98a5e"/>
      <path d="M100,700 C104,588 168,528 262,510 L338,510 C432,528 496,588 500,700 Z" fill="url(#jacketGrad)"/>
      <!-- chest color block -->
      <path d="M128,610 C190,575 410,575 472,610 L480,650 C410,618 190,618 120,650 Z" fill="#ffd23f"/>
      <path d="M120,650 C190,618 410,618 480,650 L486,672 C410,642 190,642 114,672 Z" fill="#ff7a2f"/>
      <!-- collar -->
      <path d="M246,468 L354,468 L366,544 C340,556 260,556 234,544 Z" fill="#0f6f6e"/>
      <path d="M246,468 L354,468 L357,486 C330,494 270,494 243,486 Z" fill="#0b5352"/>
      <!-- zipper -->
      <line x1="300" y1="552" x2="300" y2="700" stroke="#0b4443" stroke-width="5"/>
      <line x1="300" y1="552" x2="300" y2="700" stroke="#9fd9d6" stroke-width="2" stroke-dasharray="3 4"/>
      <!-- chest patch -->
      <g transform="translate(380,585) rotate(-6)">
        <rect x="-34" y="-12" width="68" height="24" rx="6" fill="#0b2b46"/>
        <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#ffd23f" font-family="system-ui, sans-serif">SEND IT</text>
      </g>
      <!-- lift ticket -->
      <g id="ticket" transform="translate(300,560)">
        <rect x="-4" y="-6" width="8" height="14" rx="2" fill="#d8e6e6"/>
        <line x1="0" y1="8" x2="0" y2="26" stroke="#333" stroke-width="1.5"/>
        <g transform="translate(0,26)">
          <rect x="-24" y="0" width="48" height="32" rx="3" fill="#ffffff" stroke="#c9c9c9"/>
          <rect x="-24" y="0" width="48" height="9" rx="3" fill="#e0408f"/>
          <g fill="#222"><rect x="-18" y="14" width="2" height="12"/><rect x="-14" y="14" width="1" height="12"/><rect x="-11" y="14" width="3" height="12"/><rect x="-6" y="14" width="1" height="12"/><rect x="-3" y="14" width="2" height="12"/><rect x="1" y="14" width="3" height="12"/><rect x="6" y="14" width="1" height="12"/><rect x="9" y="14" width="2" height="12"/><rect x="13" y="14" width="1" height="12"/><rect x="16" y="14" width="2" height="12"/></g>
        </g>
      </g>
    </g>

    <!-- Head -->
    <g id="head">
      <!-- back hair -->
      <g fill="#d9a548">
        <use href="#hairLock"/>
        <use href="#hairLock" transform="translate(600,0) scale(-1,1)"/>
      </g>
      <!-- ears -->
      <ellipse cx="183" cy="336" rx="16" ry="26" fill="#d6956a"/>
      <ellipse cx="417" cy="336" rx="16" ry="26" fill="#d6956a"/>
      <!-- face -->
      <ellipse cx="300" cy="322" rx="118" ry="138" fill="#e0a77a"/>
      <!-- goggle tan -->
      <rect x="204" y="286" width="192" height="66" rx="32" fill="#f4d3b3"/>
      <!-- cheeks -->
      <ellipse cx="226" cy="368" rx="22" ry="13" fill="#ff6f6f" opacity=".35"/>
      <ellipse cx="374" cy="368" rx="22" ry="13" fill="#ff6f6f" opacity=".35"/>
      <!-- beard -->
      <path d="M184,335 C186,442 245,480 300,480 C355,480 414,442 416,335 C405,374 386,394 356,390 C334,386 320,380 300,380 C280,380 266,386 244,390 C214,394 195,374 184,335 Z" fill="#9a6535"/>
      <g stroke="#7d4f27" stroke-width="2" stroke-linecap="round" opacity=".6">
        <line x1="215" y1="420" x2="219" y2="430"/><line x1="240" y1="445" x2="243" y2="456"/><line x1="270" y1="458" x2="271" y2="468"/>
        <line x1="330" y1="458" x2="329" y2="468"/><line x1="360" y1="445" x2="357" y2="456"/><line x1="385" y1="420" x2="381" y2="430"/>
      </g>
      <!-- mouth -->
      <g id="mouth">
        <path id="mouthShape" d="" fill="#5a1e1e" stroke="#3b1a12" stroke-width="3" stroke-linejoin="round"/>
        <g clip-path="url(#mouthClip)">
          <rect id="teeth" x="240" y="0" width="120" height="13" fill="#fffaf2"/>
          <ellipse id="tongue" cx="300" cy="0" rx="26" ry="14" fill="#e86a6a"/>
        </g>
      </g>
      <!-- mustache -->
      <path d="M258,390 C272,374 291,375 300,382 C309,375 328,374 342,390 C327,385 311,386 300,391 C289,386 273,385 258,390 Z" fill="#7a4a24"/>
      <!-- nose -->
      <path d="M300,330 C292,352 286,360 292,365 C297,369 304,369 309,365" fill="none" stroke="#b9774a" stroke-width="4" stroke-linecap="round"/>
      <!-- eyes -->
      <g id="eyeL">
        <ellipse cx="255" cy="318" rx="23" ry="18" fill="#ffffff"/>
        <g clip-path="url(#eyeClipL)"><g class="iris"><circle cx="255" cy="318" r="12" fill="#3a8fd8"/><circle class="pupil" cx="255" cy="318" r="6" fill="#0e1a2a"/><circle cx="259" cy="313" r="3" fill="#ffffff"/></g></g>
        <ellipse cx="255" cy="318" rx="23" ry="18" fill="none" stroke="#3b2414" stroke-width="3"/>
      </g>
      <g id="eyeR">
        <ellipse cx="345" cy="318" rx="23" ry="18" fill="#ffffff"/>
        <g clip-path="url(#eyeClipR)"><g class="iris"><circle cx="345" cy="318" r="12" fill="#3a8fd8"/><circle class="pupil" cx="345" cy="318" r="6" fill="#0e1a2a"/><circle cx="349" cy="313" r="3" fill="#ffffff"/></g></g>
        <ellipse cx="345" cy="318" rx="23" ry="18" fill="none" stroke="#3b2414" stroke-width="3"/>
      </g>
      <!-- brows -->
      <rect id="browL" x="230" y="284" width="48" height="10" rx="5" fill="#8a5a2c"/>
      <rect id="browR" x="322" y="284" width="48" height="10" rx="5" fill="#8a5a2c"/>
      <!-- fringe poking out under beanie -->
      <path d="M200,262 Q206,288 222,276 Q232,290 248,274 Q262,286 276,272 L300,266 L200,262 Z" fill="#e3b45a"/>
      <path d="M400,262 Q394,288 378,276 Q368,290 354,274 L330,268 L400,262 Z" fill="#e3b45a"/>
      <!-- beanie -->
      <g id="beanie">
        <path d="M178,262 C175,170 240,138 300,138 C360,138 425,170 422,262 Z" fill="#ff7a2f"/>
        <g clip-path="url(#domeClip)">
          <rect x="170" y="176" width="260" height="14" fill="#ffffff"/>
          <rect x="170" y="200" width="260" height="10" fill="#1f3b5c"/>
        </g>
        <rect x="168" y="226" width="264" height="46" rx="18" fill="url(#ribs)"/>
        <circle cx="300" cy="130" r="30" fill="#ffffff"/>
        <circle cx="300" cy="130" r="30" fill="none" stroke="#e8eef5" stroke-width="8" stroke-dasharray="2 5"/>
      </g>
      <!-- goggles -->
      <g id="goggles">
        <rect x="170" y="222" width="260" height="22" rx="6" fill="#1b1b22"/>
        <g fill="#ffd23f" font-size="11" font-weight="800" font-family="system-ui, sans-serif">
          <text x="186" y="237">POW</text><text x="384" y="237">POW</text>
        </g>
        <rect x="212" y="198" width="176" height="68" rx="31" fill="#f5f7fa"/>
        <rect x="220" y="205" width="160" height="54" rx="26" fill="url(#lensGrad)"/>
        <path d="M236,214 L268,214 L246,250 L226,250 Z" fill="#ffffff" opacity=".35"/>
        <path d="M276,214 L288,214 L266,250 L254,250 Z" fill="#ffffff" opacity=".22"/>
        <path d="M288,262 Q300,248 312,262 Z" fill="#e0a77a"/>
      </g>
    </g>

    <!-- Shaka glove -->
    <g id="shaka" transform="translate(500,800)">
      <g id="shakaInner">
        <g transform="translate(30,-12) rotate(32)"><rect x="-11" y="-60" width="22" height="64" rx="11" fill="#ff7a2f" stroke="#c9541a" stroke-width="2"/></g>
        <g transform="translate(-30,4) rotate(-62)"><rect x="-12" y="-58" width="24" height="60" rx="12" fill="#ff7a2f" stroke="#c9541a" stroke-width="2"/></g>
        <rect x="-38" y="-24" width="76" height="72" rx="24" fill="#ff7a2f" stroke="#c9541a" stroke-width="2"/>
        <rect x="-28" y="-34" width="20" height="28" rx="10" fill="#ff8c48" stroke="#c9541a" stroke-width="2"/>
        <rect x="-8" y="-36" width="20" height="30" rx="10" fill="#ff8c48" stroke="#c9541a" stroke-width="2"/>
        <rect x="12" y="-32" width="18" height="26" rx="9" fill="#ff8c48" stroke="#c9541a" stroke-width="2"/>
        <rect x="-36" y="42" width="72" height="56" rx="10" fill="#1f3b5c"/>
        <rect x="-36" y="50" width="72" height="8" fill="#ffd23f"/>
      </g>
    </g>
  </g>
</svg>
</div>

<div id="ui">
  <h1>🎿 Skier VTuber</h1>
  <div class="row">
    <button id="micBtn" class="primary">Enable mic</button>
    <span class="status" id="micStatus">Mic off. Hold Space to talk.</span>
  </div>
  <div id="meter"><div></div></div>
  <div class="row">
    <label><span>Sensitivity</span><input id="gain" type="range" min="2" max="40" value="14"></label>
    <label><span>Noise gate</span><input id="gate" type="range" min="0" max="60" value="12"></label>
  </div>
  <div class="row" id="exprRow">
    <button data-expr="stoked" class="on">1 Stoked</button>
    <button data-expr="chill">2 Chill</button>
    <button data-expr="shook">3 Shook</button>
    <button data-expr="send">4 Send it</button>
    <button id="shakaBtn">S Shaka</button>
  </div>
  <div class="row">
    <button id="bgBtn">B Background: scene</button>
    <button id="hideBtn">H Hide panel</button>
  </div>
  <div class="keys">Head follows your mouse. Mouth follows your mic.<br>For OBS: Background → green, hide panel, Window Capture + Chroma Key.</div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------- expressions ----------
  const EXPR = {
    stoked: { smile: 14, width: 52, brow: 3,  browTilt: 0,   lid: 1.0,  eyeScale: 1.0,  minOpen: 0,   goggles: 0, tilt: 0 },
    chill:  { smile: 7,  width: 40, brow: 0,  browTilt: 4,   lid: 0.5,  eyeScale: 1.0,  minOpen: 0,   goggles: 0, tilt: 5 },
    shook:  { smile: -6, width: 30, brow: 8,  browTilt: -6,  lid: 1.15, eyeScale: 0.7,  minOpen: 0.45, goggles: 0, tilt: -2 },
    send:   { smile: 18, width: 60, brow: -2, browTilt: -12, lid: 1.0,  eyeScale: 1.0,  minOpen: 0,   goggles: 1, tilt: 0 },
  };
  let target = { ...EXPR.stoked };
  const cur = { ...EXPR.stoked };

  function setExpr(name) {
    target = { ...EXPR[name] };
    document.querySelectorAll('#exprRow [data-expr]').forEach(b => b.classList.toggle('on', b.dataset.expr === name));
  }
  document.querySelectorAll('#exprRow [data-expr]').forEach(b => b.addEventListener('click', () => setExpr(b.dataset.expr)));

  let shakaOn = false;
  function toggleShaka() { shakaOn = !shakaOn; $('shakaBtn').classList.toggle('on', shakaOn); }
  $('shakaBtn').addEventListener('click', toggleShaka);

  // ---------- background / UI ----------
  const BGS = ['scene', 'green', 'transparent'];
  let bgIdx = 0;
  function setBg(i) {
    bgIdx = i % BGS.length;
    document.body.classList.remove('bg-green', 'bg-transparent');
    if (BGS[bgIdx] !== 'scene') document.body.classList.add('bg-' + BGS[bgIdx]);
    $('bgBtn').textContent = 'B Background: ' + BGS[bgIdx];
  }
  $('bgBtn').addEventListener('click', () => setBg(bgIdx + 1));
  const toggleUi = () => document.body.classList.toggle('ui-hidden');
  $('hideBtn').addEventListener('click', toggleUi);

  const params = new URLSearchParams(location.search);
  if (BGS.includes(params.get('bg'))) setBg(BGS.indexOf(params.get('bg')));
  if (params.get('ui') === '0') document.body.classList.add('ui-hidden');

  // ---------- input ----------
  let mx = 0, my = 0;
  window.addEventListener('pointermove', (e) => {
    mx = clamp((e.clientX / innerWidth) * 2 - 1, -1, 1);
    my = clamp((e.clientY / innerHeight) * 2 - 1, -1, 1);
  });
  let spaceTalk = false;
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { spaceTalk = true; e.preventDefault(); }
    const map = { Digit1: 'stoked', Digit2: 'chill', Digit3: 'shook', Digit4: 'send' };
    if (map[e.code]) setExpr(map[e.code]);
    if (e.code === 'KeyS') toggleShaka();
    if (e.code === 'KeyB') setBg(bgIdx + 1);
    if (e.code === 'KeyH') toggleUi();
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') spaceTalk = false; });

  // ---------- mic ----------
  let analyser = null, buf = null, micLevel = 0;
  $('micBtn').addEventListener('click', async () => {
    if (analyser) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      buf = new Uint8Array(analyser.fftSize);
      src.connect(analyser);
      $('micBtn').textContent = 'Mic on';
      $('micBtn').classList.replace('primary', 'on');
      $('micStatus').textContent = 'Talk and the mouth moves.';
    } catch (err) {
      $('micStatus').textContent = 'Mic blocked. Hold Space to talk instead.';
    }
  });

  function readMic() {
    if (!analyser) return 0;
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / buf.length) * 1000; // roughly 0..300
    const gate = +$('gate').value, gain = +$('gain').value;
    return clamp(((rms - gate) * gain) / 1000, 0, 1);
  }

  // ---------- rig ----------
  const el = {
    head: $('head'), body: $('body'), eyeL: $('eyeL'), eyeR: $('eyeR'),
    irises: document.querySelectorAll('.iris'), pupils: document.querySelectorAll('.pupil'),
    browL: $('browL'), browR: $('browR'), mouthShape: $('mouthShape'), mouthClip: $('mouthClipPath'),
    teeth: $('teeth'), tongue: $('tongue'), goggles: $('goggles'), shaka: $('shaka'),
    shakaInner: $('shakaInner'), ticket: $('ticket'), meter: document.querySelector('#meter div'),
  };

  function mouthPath(open, smile, w) {
    const cx = 300, base = 404;
    const corner = base - smile * 0.6;
    const upper = corner + smile * 0.75 - open * 10;
    const lower = corner + smile + open * 64;
    return { d: `M${cx - w},${corner} Q${cx},${upper} ${cx + w},${corner} Q${cx},${lower} ${cx - w},${corner} Z`, corner, upper, lower };
  }

  let blink = 0, nextBlink = performance.now() + 2500, open = 0, shakaY = 0;
  let headX = 0, headY = 0;

  function frame(t) {
    const s = t / 1000;

    // ease expression
    for (const k in cur) cur[k] = lerp(cur[k], target[k], 0.15);

    // mouth openness
    let raw = readMic();
    if (spaceTalk) raw = Math.max(raw, 0.35 + 0.45 * Math.abs(Math.sin(s * 11) * Math.sin(s * 4.3)));
    micLevel = lerp(micLevel, raw, raw > micLevel ? 0.55 : 0.25);
    open = Math.max(micLevel, cur.minOpen);
    el.meter.style.width = (micLevel * 100).toFixed(0) + '%';

    // blink
    if (t > nextBlink) { blink = 1; nextBlink = t + 2000 + Math.random() * 3500; }
    blink = Math.max(0, blink - 0.12);
    const blinkScale = blink > 0 ? 1 - Math.sin(blink * Math.PI) : 1;

    // head motion: follow pointer + idle sway + talk bob
    headX = lerp(headX, mx, 0.08);
    headY = lerp(headY, my, 0.08);
    const sway = Math.sin(s * 1.3) * 1.6;
    const rot = headX * 9 + sway + cur.tilt;
    const tx = headX * 14;
    const ty = headY * 8 - open * 7 + Math.sin(s * 2.1) * 1.5;
    el.head.setAttribute('transform', `translate(${tx},${ty}) rotate(${rot},300,470)`);

    // breathing
    const breath = 1 + Math.sin(s * 1.8) * 0.008;
    el.body.setAttribute('transform', `translate(300,700) scale(1,${breath}) translate(-300,-700)`);
    el.ticket.setAttribute('transform', `translate(300,560) rotate(${Math.sin(s * 2.4) * 6 - headX * 8})`);

    // eyes
    const lid = clamp(cur.lid * blinkScale, 0.05, 1.3);
    el.eyeL.setAttribute('transform', `translate(255,318) scale(1,${lid}) translate(-255,-318)`);
    el.eyeR.setAttribute('transform', `translate(345,318) scale(1,${lid}) translate(-345,-318)`);
    const px = headX * 8, py = headY * 5;
    el.irises.forEach(g => g.setAttribute('transform', `translate(${px},${py})`));
    el.pupils.forEach(p => p.setAttribute('r', (6 * cur.eyeScale).toFixed(2)));

    // brows
    const by = -cur.brow - open * 3;
    el.browL.setAttribute('transform', `translate(0,${by}) rotate(${-cur.browTilt},254,289)`);
    el.browR.setAttribute('transform', `translate(0,${by}) rotate(${cur.browTilt},346,289)`);

    // mouth
    const w = cur.width + open * 6;
    const m = mouthPath(open, cur.smile, w);
    el.mouthShape.setAttribute('d', m.d);
    el.mouthClip.setAttribute('d', m.d);
    el.teeth.setAttribute('y', ((m.corner + m.upper) / 2 - 3).toFixed(1));
    el.tongue.setAttribute('cy', ((m.corner + m.lower) / 2 - 4).toFixed(1));
    el.tongue.setAttribute('rx', (w * 0.55).toFixed(1));

    // goggles up/down
    el.goggles.setAttribute('transform', `translate(0,${(cur.goggles * 92).toFixed(1)})`);

    // shaka
    shakaY = lerp(shakaY, shakaOn ? 0 : 1, 0.15);
    el.shaka.setAttribute('transform', `translate(498,${(560 + shakaY * 260).toFixed(1)})`);
    el.shakaInner.setAttribute('transform', `rotate(${Math.sin(s * 9) * 12 - 10})`);

    drawSnow();
    requestAnimationFrame(frame);
  }

  // ---------- snow ----------
  const cv = $('snow'), cx = cv.getContext('2d');
  let flakes = [];
  function resize() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    flakes = Array.from({ length: Math.round(innerWidth / 9) }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      r: (1 + Math.random() * 2.6) * devicePixelRatio, v: 0.4 + Math.random() * 1.2, p: Math.random() * 6.28,
    }));
  }
  function drawSnow() {
    if (BGS[bgIdx] !== 'scene') return;
    cx.clearRect(0, 0, cv.width, cv.height);
    cx.fillStyle = 'rgba(255,255,255,0.9)';
    for (const f of flakes) {
      f.y += f.v * devicePixelRatio; f.p += 0.02; f.x += Math.sin(f.p) * 0.5;
      if (f.y > cv.height) { f.y = -5; f.x = Math.random() * cv.width; }
      cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.283); cx.fill();
    }
  }
  window.addEventListener('resize', resize);
  resize();

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
